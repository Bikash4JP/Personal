name: Deploy to S3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the OIDC token for AWS role assumption
  contents: read

concurrency:
  group: "s3-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync site to S3
        run: |
          # Long cache for everything except index.html, since assets aren't
          # content-hashed — index.html must always revalidate so returning
          # visitors pick up new asset references right after a deploy.
          aws s3 sync . "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public, max-age=86400" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".vscode/*" \
            --exclude "README.md" \
            --exclude "index.html"

          aws s3 cp index.html "s3://${{ vars.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
