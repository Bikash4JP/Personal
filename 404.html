<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Bikash Thapa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Self-contained on purpose: CloudFront serves this file at whatever URL was missing,
       so relative asset paths would break and the page must not depend on the site's JS. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: #05070d; color: #e8edf7;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    main { padding: 24px; }
    .code { font-family: ui-monospace, Consolas, monospace; color: #22d3ee; font-size: 14px; letter-spacing: .15em; }
    h1 { margin: 12px 0; font-size: clamp(28px, 6vw, 44px); }
    p { color: #8b96ab; margin: 0 0 28px; }
    a { color: #04121a; background: linear-gradient(120deg, #22d3ee, #6366f1); padding: 12px 22px; border-radius: 10px; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist. / お探しのページは見つかりませんでした。</p>
    <a href="/">Back to bikash4jp.com</a>
  </main>
</body>

</html>
